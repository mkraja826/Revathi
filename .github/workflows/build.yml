name: Website Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit routes and public copy
        run: npm run qa

      - name: Build static site
        run: npm run build

      - name: Verify Cloudflare Pages output
        run: test -f out/index.html && test -f out/404.html
